<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kan9 Anime Hub</title>
<style>
body{margin:0;background:#111;color:#fff;font:14px sans-serif}
header{display:flex;padding:10px;background:#1b1b1b;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
input{flex:1;padding:8px;border-radius:4px;border:none}
button{padding:8px 12px;background:#ff4757;color:#fff;border:0;cursor:pointer;border-radius:4px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;padding:15px}
.card{background:#222;border-radius:8px;cursor:pointer;position:relative;overflow:hidden}
.card img{width:100%;height:220px;object-fit:cover;display:block}
.fav-btn{position:absolute;top:5px;right:5px;background:rgba(0,0,0,0.6);border:0;color:gold;padding:5px;cursor:pointer;border-radius:50%;z-index:2}
#d{display:none;padding:20px;max-width:800px;margin:auto}
.vid{position:relative;padding-bottom:56.25%;height:0;background:#000;border-radius:8px;overflow:hidden;margin:15px 0}
.vid iframe{position:absolute;width:100%;height:100%;border:0}
.btn{display:inline-block;padding:8px;margin:5px;background:#00b894;color:#fff;text-decoration:none;border-radius:4px;font-weight:bold}
.credit{font-size:12px;color:#aaa;margin-top:10px;padding:5px}
.loading{padding:30px;text-align:center;color:#aaa;grid-column:1/-1;font-size:16px;}
</style>
</head>
<body>
<header>
    <h3 onclick="location.reload()" style="cursor:pointer;margin:0 10px 0 0">Kan9</h3>
    <input id="q" placeholder="Search anime..." onkeypress="if(event.key==='Enter') search()">
    <button onclick="search()">Search</button>
    <button onclick="loadSeasonal()">Seasonal</button>
    <button onclick="showFavorites()">⭐ Favorites</button>
</header>

<div id="d">
    <button onclick="document.getElementById('d').style.display='none'; document.getElementById('grid').style.display='grid'">Back</button>
